; Shared arm controller firmware (see docs/development_guide.md).
;
;   pio run -e arm4dof      4-DOF arm demo (ultrasonic, joystick, buzzer)
;   pio run -e sorting      Automated Sorting System (stub for now)
;   pio test -e native      PC unit tests for the kinematics (needs a host g++)

[platformio]
default_envs = arm4dof

[esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Isrc/common
lib_deps =
    madhephaestus/ESP32Servo@^3.0.6
    ESP32Async/AsyncTCP@^3.3.2
    ESP32Async/ESPAsyncWebServer@^3.7.0
    bblanchon/ArduinoJson@^7.2.0
test_ignore = *

[env:arm4dof]
extends = esp32s3
build_src_filter = +<common/> +<arm4dof/>
build_flags =
    ${esp32s3.build_flags}
    -DAPP_ARM4DOF

[env:sorting]
extends = esp32s3
build_src_filter = +<common/> +<sorting/>
build_flags =
    ${esp32s3.build_flags}
    -DAPP_SORTING

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++11 -Wall
; Only the plain C++ libraries build on the PC.
lib_ignore = ArmDriver, ControllerApi, ScadaClient
