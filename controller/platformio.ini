; Shared arm controller firmware (see docs/development_guide.md).
;
;   pio run -e arm4dof      4-DOF arm demo (ultrasonic, joystick)
;   pio run -e sorting      Automated Sorting System (stub for now)
;   pio test -e native      PC unit tests for the kinematics (needs a host g++)
;   pio run -e calib_joystick | calib_ultrasonic | calib_servo
;                           standalone calibration sketches (test/calib_*)

[platformio]
default_envs = arm4dof

[esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Isrc/common
lib_deps =
    ESP32Async/AsyncTCP@^3.3.2
    ESP32Async/ESPAsyncWebServer@^3.7.0
    bblanchon/ArduinoJson@^7.2.0
test_ignore = *

[env:arm4dof]
extends = esp32s3
build_src_filter = +<common/> +<arm4dof/>
build_flags =
    ${esp32s3.build_flags}
    -DAPP_ARM4DOF

upload_port = rfc2217://100.123.177.89:4000?ign_set_control
monitor_port = rfc2217://100.123.177.89:4000?ign_set_control
upload_speed = 115200


[env:sorting]
extends = esp32s3
build_src_filter = +<common/> +<sorting/>
build_flags =
    ${esp32s3.build_flags}
    -DAPP_SORTING

; Standalone calibration sketches in test/calib_*. They use nothing from lib/
; and no external library.
;   pio run -e calib_joystick -t upload && pio device monitor
[calib]
extends = esp32s3
lib_deps =
lib_ignore = ArmKinematics, ArmDriver, ToolHead, ControllerApi, ScadaClient

[env:calib_joystick]
extends = calib
build_src_filter = -<*> +<../test/calib_joystick/>

[env:calib_ultrasonic]
extends = calib
build_src_filter = -<*> +<../test/calib_ultrasonic/>

[env:calib_servo]
extends = calib
build_src_filter = -<*> +<../test/calib_servo/>

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++11 -Wall
; Only the plain C++ libraries build on the PC.
lib_ignore = ArmDriver, ControllerApi, ScadaClient
