[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arm-gateway"
version = "0.1.0"
description = "HTTP to OPC UA gateway between the ESP32 arm controller and Ignition"
requires-python = ">=3.11"
dependencies = [
    "asyncua>=1.1,<3",
    "aiohttp>=3.9,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
arm-gateway = "arm_gateway.__main__:main"
arm-gateway-stub = "arm_gateway.stub_esp32:main"

[tool.setuptools]
packages = ["arm_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
